<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950"><rect width="1440" height="950" fill="#F7F5EF"/><defs><linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16483C"/><stop offset="1" stop-color="#0B2D27"/></linearGradient><linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D8064"/><stop offset="1" stop-color="#123B32"/></linearGradient><linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4B942"/><stop offset="1" stop-color="#F7D17A"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#123B32" flood-opacity="0.10"/></filter></defs><text x="60" y="75" font-family="Inter, Arial, sans-serif" font-size="38" fill="#123B32" font-weight="800" text-anchor="start" >Kasi24  /  Visual direction</text><text x="60" y="113" font-family="Inter, Arial, sans-serif" font-size="17" fill="#65736F" font-weight="450" text-anchor="start" >Agreed colour palette and interface application</text><line x1="60" y1="145" x2="1380" y2="145" stroke="#D9E1DB" stroke-width="2" stroke-linecap="round"/><rect x="60" y="180" width="240" height="170" rx="18" fill="#123B32" stroke="#123B32" stroke-width="1.2" /><text x="60" y="382" font-family="Inter, Arial, sans-serif" font-size="16" fill="#123B32" font-weight="750" text-anchor="start" >Deep forest green</text><text x="60" y="410" font-family="Inter, Arial, sans-serif" font-size="15" fill="#27343A" font-weight="700" text-anchor="start" >#123B32</text><text x="60" y="438" font-family="Inter, Arial, sans-serif" font-size="12" fill="#65736F" font-weight="450" text-anchor="start" >Logo, headings, navigation</text><rect x="327" y="180" width="240" height="170" rx="18" fill="#22A06B" stroke="#22A06B" stroke-width="1.2" /><text x="327" y="382" font-family="Inter, Arial, sans-serif" font-size="16" fill="#123B32" font-weight="750" text-anchor="start" >Fresh green</text><text x="327" y="410" font-family="Inter, Arial, sans-serif" font-size="15" fill="#27343A" font-weight="700" text-anchor="start" >#22A06B</text><text x="327" y="438" font-family="Inter, Arial, sans-serif" font-size="12" fill="#65736F" font-weight="450" text-anchor="start" >Primary actions and success states</text><rect x="594" y="180" width="240" height="170" rx="18" fill="#F4B942" stroke="#F4B942" stroke-width="1.2" /><text x="594" y="382" font-family="Inter, Arial, sans-serif" font-size="16" fill="#123B32" font-weight="750" text-anchor="start" >Warm gold</text><text x="594" y="410" font-family="Inter, Arial, sans-serif" font-size="15" fill="#27343A" font-weight="700" text-anchor="start" >#F4B942</text><text x="594" y="438" font-family="Inter, Arial, sans-serif" font-size="12" fill="#65736F" font-weight="450" text-anchor="start" >Featured accents and small highlights</text><rect x="861" y="180" width="240" height="170" rx="18" fill="#F7F5EF" stroke="#D9E1DB" stroke-width="1.2" /><text x="861" y="382" font-family="Inter, Arial, sans-serif" font-size="16" fill="#123B32" font-weight="750" text-anchor="start" >Soft cream</text><text x="861" y="410" font-family="Inter, Arial, sans-serif" font-size="15" fill="#27343A" font-weight="700" text-anchor="start" >#F7F5EF</text><text x="861" y="438" font-family="Inter, Arial, sans-serif" font-size="12" fill="#65736F" font-weight="450" text-anchor="start" >Page and section backgrounds</text><rect x="1128" y="180" width="240" height="170" rx="18" fill="#27343A" stroke="#27343A" stroke-width="1.2" /><text x="1128" y="382" font-family="Inter, Arial, sans-serif" font-size="16" fill="#123B32" font-weight="750" text-anchor="start" >Charcoal</text><text x="1128" y="410" font-family="Inter, Arial, sans-serif" font-size="15" fill="#27343A" font-weight="700" text-anchor="start" >#27343A</text><text x="1128" y="438" font-family="Inter, Arial, sans-serif" font-size="12" fill="#65736F" font-weight="450" text-anchor="start" >Body text and labels</text><text x="60" y="505" font-family="Inter, Arial, sans-serif" font-size="22" fill="#123B32" font-weight="800" text-anchor="start" >Typography direction</text><text x="60" y="552" font-family="Inter, Arial, sans-serif" font-size="46" fill="#123B32" font-weight="800" text-anchor="start" >Kasi24</text><text x="225" y="552" font-family="Inter, Arial, sans-serif" font-size="20" fill="#27343A" font-weight="500" text-anchor="start" >Friendly, grounded, legible</text><text x="60" y="594" font-family="Inter, Arial, sans-serif" font-size="14" fill="#65736F" font-weight="500" text-anchor="start" >Headings: bold sans serif  |  Body: regular sans serif  |  Labels: medium weight</text><text x="60" y="660" font-family="Inter, Arial, sans-serif" font-size="22" fill="#123B32" font-weight="800" text-anchor="start" >Core UI controls</text><rect x="60" y="695" width="210" height="52" rx="12" fill="#22A06B" /><text x="165.0" y="726.1" font-family="Inter, Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="750" text-anchor="middle" >Primary action</text><rect x="290" y="695" width="210" height="52" rx="12" fill="#FFFFFF" stroke="#22A06B" stroke-width="1.2" /><text x="395.0" y="726.1" font-family="Inter, Arial, sans-serif" font-size="15" fill="#123B32" font-weight="700" text-anchor="middle" >Secondary action</text><rect x="520" y="695" width="210" height="52" rx="12" fill="#F4B942" /><text x="625.0" y="726.1" font-family="Inter, Arial, sans-serif" font-size="15" fill="#123B32" font-weight="750" text-anchor="middle" >Featured accent</text><rect x="60" y="780" width="1320" height="105" rx="16" fill="#FFF2D5" /><text x="84" y="817" font-family="Inter, Arial, sans-serif" font-size="15" fill="#123B32" font-weight="800" text-anchor="start" >Accessibility note</text><text x="84" y="844" font-family="Inter, Arial, sans-serif" font-size="13" fill="#27343A" font-weight="450" text-anchor="start" >Use charcoal or forest-green text on the gold accent. Avoid small white text on gold. Keep focus states visible,</text><text x="84" y="865" font-family="Inter, Arial, sans-serif" font-size="13" fill="#27343A" font-weight="450" text-anchor="start" >provide labels for inputs, and pair colour with text/icons so status is not conveyed by colour alone.</text></svg>