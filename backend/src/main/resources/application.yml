spring:
  application:
    name: kasi24-backend

  # Supabase Postgres - values come from Supabase dashboard > Project Settings > Database.
  # Set them as environment variables (see backend/.env.example). Never commit real values.
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:54322/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}

  jpa:
    # The schema is owned by the SQL migrations in infrastructure/supabase/migrations
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # Validates Supabase Auth access tokens
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_URL:http://localhost:54321}/auth/v1/.well-known/jwks.json

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
