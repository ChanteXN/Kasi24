# Runs backend + frontend against your Supabase project.
# From the repo root:  docker compose -f infrastructure/docker/docker-compose.yml up --build
services:
  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file: ../../backend/.env
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
